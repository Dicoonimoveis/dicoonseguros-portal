name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Clean build (no cache)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      DEBUG: "vite:*,tanstack:*,@tanstack/*"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Purge all caches (clean build)
        run: |
          rm -rf node_modules
          rm -rf .vite .cache dist dist-ssr .output .tanstack
          rm -rf src/routeTree.gen.ts
          bun pm cache rm || true

      - name: Install dependencies (no cache, frozen lockfile)
        run: bun install --frozen-lockfile --no-cache

      - name: Build with verbose router plugin logs
        id: build
        run: |
          set -o pipefail
          bunx vite build --debug --logLevel info 2>&1 | tee build.log

      - name: Verify route tree was generated
        if: always()
        run: |
          if [ ! -f src/routeTree.gen.ts ]; then
            echo "::error title=Router plugin failed::src/routeTree.gen.ts was not generated by @tanstack/router-plugin."
            echo "--- Router-related log lines ---"
            grep -iE "router-plugin|routeTree|router-generator|crawling result|tanstack" build.log || true
            echo "--- Last 200 lines of build.log ---"
            tail -n 200 build.log
            exit 1
          fi
          echo "routeTree.gen.ts generated successfully ($(wc -l < src/routeTree.gen.ts) lines)."

      - name: Surface router plugin errors on failure
        if: failure()
        run: |
          echo "::group::Router plugin diagnostics"
          grep -niE "router-plugin|routeTree|router-generator|crawling result|failed to|error" build.log || echo "(no matching lines)"
          echo "::endgroup::"
          echo "::group::Full build log (tail)"
          tail -n 500 build.log
          echo "::endgroup::"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
